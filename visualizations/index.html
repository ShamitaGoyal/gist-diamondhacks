<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM API Failure Modes — ECharts Tree</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    header p { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    /* ECharts appends tooltip to body with class gist-echarts-tooltip */
    .gist-echarts-tooltip {
      max-width: 360px !important;
      white-space: normal !important;
      word-wrap: break-word !important;
      overflow-wrap: anywhere !important;
      word-break: break-word !important;
    }
    .gist-echarts-tooltip .gist-tooltip-inner {
      max-width: 100%;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .gist-echarts-tooltip .gist-tip-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .gist-echarts-tooltip .gist-tip-badges {
      color: #94a3b8;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .gist-echarts-tooltip .gist-tip-block {
      margin-top: 8px;
    }
    .gist-echarts-tooltip .gist-tip-label {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    .gist-echarts-tooltip .gist-tip-explanation .gist-tip-label { color: #a5b4fc; }
    .gist-echarts-tooltip .gist-tip-symptoms .gist-tip-label { color: #fbbf24; }
    .gist-echarts-tooltip .gist-tip-code .gist-tip-label { color: #4ade80; }
    .gist-echarts-tooltip .gist-tip-body {
      font-size: 11px;
      line-height: 1.45;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .gist-echarts-tooltip .gist-tip-list {
      margin: 4px 0 0 14px;
      padding: 0;
    }
    .gist-echarts-tooltip .gist-tip-pre {
      margin: 4px 0 0;
      padding: 6px 8px;
      background: #0f172a;
      border-radius: 4px;
      font-size: 10px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-x: auto;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LLM API Failure Modes</h1>
      <p>Issue <strong>impact</strong> (critical / high / medium) sizes & colors nodes · tooltips show <strong>symptoms</strong> & fix <strong>code_hint</strong></p>
    </div>
    <div class="legend" id="legend-type" style="display:flex;flex-wrap:wrap;gap:8px;font-size:0.7rem"></div>
    <div class="legend" id="legend-impact" style="display:flex;flex-wrap:wrap;gap:8px;font-size:0.7rem"></div>
    <span id="status">Loading…</span>
  </header>
  <div id="main" style="width:100%;height:calc(100% - 72px);min-height:480px;"></div>

  <script>
    const TYPE_COLORS = {
      root: "#6366f1",
      branch: "#a78bfa",
      issue: "#f87171",
      cause: "#fb923c",
      fix: "#4ade80",
      bp: "#38bdf8",
    };

    const IMPACT_COLORS = {
      critical: "#dc2626",
      high: "#f97316",
      medium: "#eab308",
    };

    const IMPACT_SIZE = { critical: 18, high: 13, medium: 9 };

    const TYPE_LABELS = {
      root: "Root",
      branch: "Category",
      issue: "Issue",
      cause: "Cause",
      fix: "Fix",
      bp: "Best practice",
    };

    function issueSymbolSize(node) {
      if (node.type !== "issue") return 8;
      return IMPACT_SIZE[node.impact] || 10;
    }

    function nodeColor(node) {
      if (node.type === "issue" && node.impact && IMPACT_COLORS[node.impact]) {
        return IMPACT_COLORS[node.impact];
      }
      return TYPE_COLORS[node.type] || "#94a3b8";
    }

    const TOOLTIP_MAX_WIDTH = 360;

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toEchartsTree(node) {
      const out = {
        name: node.label || node.id || "node",
        _type: node.type,
        _detail: node.detail || "",
        _explanation: node.explanation || "",
        _id: node.id,
        _impact: node.impact,
        _symptoms: node.symptoms,
        _code_hint: node.code_hint,
        symbolSize: issueSymbolSize(node),
        itemStyle: {
          color: nodeColor(node),
          borderColor: node.type === "issue" && node.impact === "critical" ? "#fef2f2" : "#1e293b",
          borderWidth: node.type === "issue" ? 2 : 1,
        },
      };
      const kids = node.children;
      if (Array.isArray(kids) && kids.length > 0) {
        out.children = kids.map(toEchartsTree);
      } else if (node.type !== "branch" && node.type !== "root") {
        out.value = 1;
      }
      return out;
    }

    function buildLegends() {
      document.getElementById("legend-type").innerHTML =
        "<strong style='margin-right:6px'>Type</strong>" +
        Object.entries(TYPE_COLORS)
          .map(([t, c]) => `<span style="margin-right:8px"><i style="background:${c};width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:3px"></i>${TYPE_LABELS[t]}</span>`)
          .join("");

      document.getElementById("legend-impact").innerHTML =
        "<strong style='margin-right:6px'>Impact</strong>" +
        Object.entries(IMPACT_COLORS)
          .map(([k, c]) => `<span style="margin-right:8px"><i style="background:${c};width:10px;height:10px;display:inline-block;border-radius:50%;margin-right:3px"></i>${k}</span>`)
          .join("");
    }

    function setStatus(text, isError) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.style.color = isError ? "#f87171" : "#94a3b8";
    }

    function wrapBlock(className, title, bodyHtml) {
      return (
        `<div class="gist-tip-block ${className}">` +
        (title ? `<div class="gist-tip-label">${escapeHtml(title)}</div>` : "") +
        `<div class="gist-tip-body">${bodyHtml}</div>` +
        `</div>`
      );
    }

    function formatTooltip(params) {
      const d = params.data || {};
      const parts = [];

      const badges = [];
      if (d._type) badges.push(TYPE_LABELS[d._type] || d._type);
      if (d._impact) badges.push(`impact: ${d._impact}`);
      parts.push(`<div class="gist-tip-title">${escapeHtml(params.name)}</div>`);

      if (badges.length) {
        parts.push(`<div class="gist-tip-badges">${escapeHtml(badges.join(" · "))}</div>`);
      }

      if (d._explanation) {
        parts.push(wrapBlock("gist-tip-explanation", "Summary", escapeHtml(d._explanation)));
      }

      if (d._detail) {
        parts.push(
          wrapBlock(
            "gist-tip-detail",
            d._explanation ? "Detail" : "",
            escapeHtml(d._detail)
          )
        );
      }

      if (Array.isArray(d._symptoms) && d._symptoms.length) {
        const list = d._symptoms.map((s) => `<li>${escapeHtml(s)}</li>`).join("");
        parts.push(wrapBlock("gist-tip-symptoms", "Symptoms", `<ul class="gist-tip-list">${list}</ul>`));
      }

      if (d._code_hint) {
        parts.push(
          wrapBlock(
            "gist-tip-code",
            "Code hint",
            `<pre class="gist-tip-pre">${escapeHtml(d._code_hint)}</pre>`
          )
        );
      }

      return `<div class="gist-tooltip-inner">${parts.join("")}</div>`;
    }

    async function loadApiData() {
      const res = await fetch("./api.json");
      if (!res.ok) {
        throw new Error(
          `Could not load api.json (${res.status}). Run: cd visualizations && python3 -m http.server 8765`
        );
      }
      const json = await res.json();
      const root = json.id ? json : json.root || json.data;
      if (!root?.label) throw new Error("api.json must be a tree root with label and children");
      return toEchartsTree(root);
    }

    function buildOption(treeData) {
      return {
        tooltip: {
          trigger: "item",
          triggerOn: "mousemove",
          enterable: true,
          confine: true,
          appendToBody: true,
          className: "gist-echarts-tooltip",
          extraCssText: [
            `max-width:${TOOLTIP_MAX_WIDTH}px`,
            "min-width:0",
            "white-space:normal",
            "word-wrap:break-word",
            "overflow-wrap:anywhere",
            "word-break:break-word",
            "line-height:1.45",
            "padding:10px 12px",
            "background:#1e293b",
            "border:1px solid #475569",
            "border-radius:8px",
            "box-shadow:0 8px 24px rgba(0,0,0,0.35)",
            "color:#e2e8f0",
          ].join(";"),
          formatter: formatTooltip,
        },
        series: [
          {
            type: "tree",
            data: [treeData],
            top: "2%",
            left: "10%",
            bottom: "2%",
            right: "22%",
            symbol: "roundRect",
            orient: "LR",
            initialTreeDepth: 2,
            label: {
              position: "left",
              verticalAlign: "middle",
              align: "right",
              fontSize: 11,
              color: "#e2e8f0",
            },
            leaves: {
              label: { position: "right", verticalAlign: "middle", align: "left" },
            },
            lineStyle: { color: "#475569", width: 1.5, curveness: 0.5 },
            emphasis: { focus: "descendant" },
            expandAndCollapse: true,
            animationDuration: 550,
            animationDurationUpdate: 750,
          },
        ],
      };
    }

    async function main() {
      buildLegends();
      const myChart = echarts.init(document.getElementById("main"));

      myChart.showLoading({ text: "Loading api.json…", color: "#6366f1" });

      try {
        const treeData = await loadApiData();
        myChart.hideLoading();
        myChart.setOption(buildOption(treeData));
        const branches = treeData.children?.length ?? 0;
        setStatus(`Ready — ${countNodes(treeData)} nodes · ${branches} branches`);
      } catch (err) {
        myChart.hideLoading();
        setStatus(err.message || String(err), true);
        console.error(err);
      }

      window.addEventListener("resize", () => myChart.resize());
    }

    function countNodes(node) {
      let n = 1;
      if (node.children) for (const c of node.children) n += countNodes(c);
      return n;
    }

    main();
  </script>
</body>
</html>
